# Security tools. Each tool appears exactly once.
# Category strings must match an entry in _data/categories.yml.
# `description` is a short one-liner shown on the card and searched by the
# autocomplete — keep it under ~70 characters.

# AI Security — LLM red-teaming, prompt-injection scanners, guardrails.
